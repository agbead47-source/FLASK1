{% extends 'base.html' %}

{% block content %}
<style>
    /* 숍 전용 레이아웃 */
    .shop-header { padding: 60px 40px; border-bottom: 2px solid #111; }
    .shop-header h2 { font-family: 'Anton', sans-serif; font-size: 60px; }
    
    .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }
    .product-card {
        border-right: 2px solid #111;
        border-bottom: 2px solid #111;
        text-decoration: none;
        color: #111;
        display: flex;
        flex-direction: column;
        transition: background 0.3s;
    }
    .product-card:hover { background: #111; color: #fff; }
    .product-image {
        width: 100%; height: 400px; object-fit: cover;
        border-bottom: 2px solid #111;
        filter: grayscale(80%); transition: filter 0.3s;
    }
    .product-card:hover .product-image { filter: grayscale(0%); }
    
    .product-info { padding: 30px; }
    .product-title { font-weight: 800; font-size: 20px; margin-bottom: 10px; text-transform: uppercase; }
    .product-price { font-family: 'Anton', sans-serif; font-size: 24px; margin-top: 20px; }
</style>

<div class="shop-header">
    <h2>CURATION.</h2>
    <p>엄선된 문구 컬렉션.</p>
</div>

<div class="grid-container">
    {% for item in products %}
    <a href="{{ url_for('detail', product_id=item.id) }}" class="product-card">
        <img src="{{ item.image }}" alt="{{ item.name }}" class="product-image">
        <div class="product-info">
            <h3 class="product-title">{{ item.name }}</h3>
            <p>{{ item.desc }}</p>
            <p class="product-price">{{ item.price }}</p>
        </div>
    </a>
    {% endfor %}
</div>
{% endblock %}
