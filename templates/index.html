{% extends 'base.html' %}

{% block content %}
<style>
    .hero-section { display: flex; flex-direction: column; align-items: center; padding: 100px 20px; text-align: center; border-bottom: 2px solid #111; }
    .hero-title { font-family: 'Anton', sans-serif; font-size: 12vw; line-height: 0.9; color: #111; text-transform: uppercase; margin-bottom: 20px; }
    .hero-subtitle { font-weight: 700; font-size: 24px; letter-spacing: 5px; margin-bottom: 50px; }
    .hero-image { width: 100%; max-width: 1200px; height: 60vh; object-fit: cover; border: 2px solid #111; filter: grayscale(100%); transition: filter 0.5s; }
    .hero-image:hover { filter: grayscale(0%); }
</style>

<section class="hero-section">
    <h1 class="hero-title">STATIONERY<br>IS DEAD?</h1>
    <p class="hero-subtitle">NO, IT'S JUST EVOLVING.</p>
    <img src="{{ url_for('static', filename='images/cover.jpg') }}" alt="Vintage Notebook" class="hero-image">
</section>
{% endblock %}
